name: Build Windows Installer

on:
  push:
    branches: [main, integration]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # BaSiCPy upstream hard-pins scipy<1.13 (no cp313/cp314 wheels).
          # Pip would source-build scipy 1.12, which dies without a fortran
          # toolchain. Pre-pin scipy/numpy at versions with cp wheels, then
          # install basicpy with --no-deps so its outdated scipy/jax pins
          # don't force a downgrade. Manually provide basicpy's runtime
          # deps from PyPI at cp-wheel-having versions.
          pip install "scipy>=1.13" "numpy>=2.0"
          pip install --no-deps "basicpy @ git+https://github.com/QI2lab/BaSiCPy.git"
          pip install "hyperactive>=4.8" "gradient-free-optimizers>=1.6" jax pooch "pydantic>=2.7,<3" scikit-image
          pip install ".[gui]" matplotlib pyinstaller "napari[pyqt5]" napari-ome-zarr

      - name: Validate gui/tilefusion signatures
        run: python installer/validate_signatures.py

      - name: Apply VisPy Blackwell patch (idempotent)
        run: python installer/patch_vispy_blackwell.py

      - name: Build with PyInstaller
        working-directory: installer
        run: python -m PyInstaller stitcher_windows.spec --noconfirm --distpath ../dist --workpath ../build --clean

      - name: Post-build smoke test
        continue-on-error: true
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          dist\stitcher-gui\stitcher-gui.exe --smoke-test

      - name: Stage artifact
        run: |
          copy README.md dist\stitcher-gui\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stitcher-windows
          path: dist/stitcher-gui/
