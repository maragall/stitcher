name: Build Windows Installer

on:
  push:
    branches: [main, integration]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Reproducible builds: pin every dep via installer/constraints.txt (exact versions
          # that resolved identically across all 3 OSes on Python 3.12).
          pip install "scipy>=1.13" "numpy>=2.0"
          pip install ".[gui]" matplotlib pyinstaller "napari[pyqt5]<0.7" napari-ome-zarr
          echo "=== RESOLVED VERSIONS ===" && pip freeze

      - name: Validate gui/tilefusion signatures
        run: python installer/validate_signatures.py

      - name: Apply VisPy Blackwell patch (idempotent)
        run: python installer/patch_vispy_blackwell.py

      - name: Build with PyInstaller
        working-directory: installer
        run: python -m PyInstaller stitcher_windows.spec --noconfirm --distpath ../dist --workpath ../build --clean

      - name: Post-build smoke test
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          dist\stitcher-gui\stitcher-gui.exe --smoke-test

      - name: Stage artifact
        run: |
          copy README.md dist\stitcher-gui\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stitcher-windows
          path: dist/stitcher-gui/
